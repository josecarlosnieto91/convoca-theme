name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: PHPCS (WordPress Coding Standards)
        run: vendor/bin/phpcs --standard=.phpcs.xml.dist
  php-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, wp-cli

      - name: Instalar gettext (msgfmt, del contrato de traducciones)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext
      - name: Validate composer
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP lint
        run: find . -name '*.php' -not -path './vendor/*' -exec php -l {} \;

      - name: PHPUnit
        run: vendor/bin/phpunit --no-coverage

      - name: PHPStan (análisis estático, bloquante)
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress --memory-limit=2G

  theme-check:
    name: Theme Check (WordPress.org)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, wp-cli

      - name: Build clean theme dir (as published)
        run: |
          mkdir -p build-dir
          rsync -a --exclude-from=.distignore ./ build-dir/convoca/
          ls build-dir/convoca/

      - name: Install WordPress + Theme Check plugin
        run: |
          mkdir -p wp-test
          wp core download --path=wp-test --allow-root
          wp config create --path=wp-test --dbname=wordpress --dbuser=root \
            --dbpass=root --dbhost=127.0.0.1 --allow-root
          wp core install --path=wp-test --url=http://localhost:8080 \
            --title="Theme Check" --admin_user=admin --admin_password=admin \
            --admin_email=admin@example.com --skip-email --allow-root
          wp plugin install theme-check --activate --path=wp-test --allow-root
          sudo cp -r build-dir/convoca wp-test/wp-content/themes/
          echo "WP + theme-check ready"

      - name: Run Theme Check
        run: |
          cd wp-test
          # Falla el job si hay REQUERIDOS o errores (exit != 0).
          wp theme-check run convoca --format=table --allow-root

  higiene:
    name: Higiene de datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El cliente no aparece en el producto (convoca-health-check#12/#13).
      # El guardián NO lleva los nombres en su código: este repositorio es público y la lista de lo
      # prohibido era el índice de clientes. Se descarga el de convoca-health-check (fuente única) y los
      # nombres llegan por secret. Secret y no variable: en un repositorio público el contexto `vars` SÍ
      # se entrega a los workflows de un PR abierto desde un fork, así que cualquiera podría imprimirlo.
      # Si el secret no está (PR desde un fork, secret borrado), el guardián avisa en el registro y sigue
      # vigilando dominios y correos; no se calla.
      - name: El cliente no aparece en el producto
        env:
          CONVOCA_HYGIENE_CLIENTES: ${{ secrets.CONVOCA_HYGIENE_CLIENTES }}
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/higiene.py" \
            https://raw.githubusercontent.com/josecarlosnieto91/convoca-health-check/main/scripts/check-data-hygiene.py
          python3 "$RUNNER_TEMP/higiene.py" .

  acoplamiento:
    name: Acoplamiento entre plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Un TEMA no crea roles ni escribe metas de un plugin. Las reglas de «llamar a clases de otro plugin»
      # (R2) y «decidir por rol de personas» (R4) no se le aplican: el tema consume el núcleo, no decide
      # quién es nadie. Vive en la misma pasada que el guardián de los plugins, con su alcance.
      - name: El tema, a lo suyo
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/acoplamiento.py" \
            https://raw.githubusercontent.com/josecarlosnieto91/convoca-health-check/main/scripts/check-acoplamiento.py
          python3 "$RUNNER_TEMP/acoplamiento.py" . --reglas R1,R3
